name: Bug 报告
description: 文档、命令或复现步骤出错
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 提交前请先看 `docs/how-to/排障.md`，并确认没有粘贴任何密钥/账号。
  - type: textarea
    id: what
    attributes:
      label: 出了什么问题
      description: 现象、报错原文（完整粘贴）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 做了哪几步、在哪个文档/命令
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 系统版本、Python/Node/DSH 版本
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已尝试
      description: 试过哪些排查、结果如何
