name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        run: python tools/check_links.py docs
      - name: Build HTML
        run: python tools/md2html.py docs site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
